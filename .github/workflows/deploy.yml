# 仓库在 nutbox-dao，Cloudflare 登录的是另一个 GitHub 账号，Pages 的 Git 连接接不上。
# 推送到 main 时由 Actions 构建，再用 Direct Upload 发布到 nutbox-app。
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 02c3e74d8f918b08e740f9cfcd4ea23d
          command: pages deploy dist --project-name nutbox-app --branch main
